<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BREVECANTO</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="home" class="screen">
  <h1>BREVECANTO</h1>
  <button onclick="mostraSchermata('brani')">Brani musicali</button>
  <button onclick="mostraSchermata('testi')">Testi e glossari</button>
  <button onclick="mostraSchermata('contesto')">Contesto dell'opera</button>
</div>

<div id="brani" class="screen" style="display:none;">
  <h2>Brani musicali</h2>
  <div id="listaBrani"></div>
  <button onclick="mostraSchermata('home')">Torna alla home</button>
</div>

<div id="audio" class="screen" style="display:none;">
  <h2 id="titoloAudio"></h2>

  <!-- PLAYER AUDIO AGGIUNTO -->
  <audio id="audioPlayer" controls></audio>

  <button onclick="indietroAudio()">◀◀</button>
  <button onclick="pausaAudio()">❚❚</button>
  <button onclick="playAudio(currentAudio)">▶</button>
  <button onclick="stopAudio()">■</button>
  <button onclick="avantiAudio()">▶▶</button>
  <br><br>
  <button onclick="apriVideo(currentBranoId)">Guarda video</button>
  <br><br>
  <button onclick="tornaAiBrani()">Torna ai brani</button>
</div>

<div id="video" class="screen" style="display:none;">
  <h2 id="titoloVideo"></h2>
  <video id="videoPlayer" width="300" controls></video>
  <br><br>
  <button onclick="apriAudio(currentBranoId)">Ascolta audio</button>
  <br><br>
  <button onclick="tornaAiBrani()">Torna ai brani</button>
</div>

<div id="testi" class="screen" style="display:none;">
  <h2>Testi e glossari</h2>
  <div id="listaTesti"></div>
  <button onclick="mostraSchermata('home')">Torna alla home</button>
</div>

<div id="testoBrano" class="screen" style="display:none;">
  <h2 id="titoloTesto"></h2>
  <div id="contenutoTesto"></div>
  <div id="fumetto" class="fumetto" style="display:none;"></div>
  <br><br>
  <button onclick="apriGlossario(currentBranoId)">Glossario completo</button>
  <button onclick="tornaAlBrano()">Torna al brano</button>
  <br><br>
  <button onclick="tornaAiTesti()">Torna ai testi</button>
</div>

<div id="glossario" class="screen" style="display:none;">
  <h2>Glossario</h2>
  <div id="listaGlossario"></div>
  <button onclick="mostraSchermata('testoBrano')">Torna al testo</button>
</div>

<div id="contesto" class="screen" style="display:none;">
  <h2>Contesto dell'opera</h2>
  <div id="contenutoContesto"></div>
  <button onclick="mostraSchermata('home')">Torna alla home</button>
</div>

<script src="./script.js"></script>
</body>
</html>
